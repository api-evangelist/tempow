name: tempow
description: Tempow was a Paris-based startup (founded 2016) building software to improve
  Bluetooth audio connectivity, including an operating system for true-wireless earbuds
  and multi-device audio streaming licensed to chipset makers and Android device
  manufacturers such as Motorola and TCL. Backed by Balderton Capital and C4 Ventures,
  Tempow was acquired by Google in 2021. The company operated as a B2B embedded-software
  and licensing business and never published a public developer API. Its website
  (www.tempow.com) no longer resolves. This profile was surfaced as a portfolio company
  of balderton-capital and added to the API Evangelist network as a lead; enrichment
  confirms there is no live API surface.
